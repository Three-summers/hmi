[package]
name = "ref-serial"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.48.0", features = ["rt", "macros", "io-util", "time"] }
tokio-serial = "=5.4.5"
serde = { version = "=1.0.228", features = ["derive"] }
bytes = "=1.11.0"
crc32fast = "=1.5.0"

[[bin]]
name = "ref-serial"
path = "src/main.rs"
